name: Deploy to GitHub Pages

# Прототип собирается статически и выкладывается на Pages при каждом
# пуше в main. Сервера у Pages нет, поэтому в next.config стоит
# output: "export", а базовый путь приходит из переменной ниже.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные выкладки только помешают друг другу.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/silavetra-charter

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: experiments/silavetra-charter/package-lock.json

      - run: npm ci

      - name: Собрать статику
        # Pages отдаёт сайт из подпапки с именем репозитория.
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: experiments/silavetra-charter/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
